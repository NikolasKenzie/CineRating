<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="styling/feedback.css" rel="stylesheet" />
    <title>CineRating</title>
  </head>
  <body>
    <main>
      <nav>
        <h2>CineRating</h2>
        <div class="box-navigation">
          <a href="index.html">Home</a>
          <a href="tierlist.html">Top 10</a>
          <a href="genres.html">Genres</a>
          <a href="feedback.html" id="curentPage">Feedback</a>
          <a href="about.html">About</a>
        </div>
      </nav>
      <div id="box-feedback-form">
        <h2>Feedback Form</h2>
        <form class="feedback-form">
          <label for="username">your name</label>
          <input type="text" id="username" name="username" />

          <label for="message">message</label>
          <textarea name="message" id="textarea-message"></textarea>
          <div class="radio-group">
            <input
              type="radio"
              id="public"
              name="visibility"
              value="public"
              required
            />
            <label for="public"
              >Allow my review to be visible to the public</label
            >
          </div>
          <div class="radio-group">
            <input
              type="radio"
              id="private"
              name="visibility"
              value="private"
              required
            />
            <label for="private">Make my review private</label>
          </div>

          <button type="submit" class="submitButton">Submit</button>
        </form>
      </div>
    </main>
  </body>
</html>
