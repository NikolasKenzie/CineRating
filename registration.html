<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="styling/registration.css" rel="stylesheet" />
    <title>CineRating</title>
  </head>
  <body>
    <main>
      <div id="box-login">
        <h2>Sign up</h2>
        <div>
          <form class="formLogin" action="index.html">
            <label for="username">username</label>
            <input type="text" id="username" name="username" required />

            <label for="email">email</label>
            <input type="text" id="email" name="email" required />

            <label for="password">password</label>
            <input type="password" id="password" name="password" required />

            <label for="ageUser">How old are you?</label>
            <select id="ageUser" name="age_group" required>
              <option value=""></option>
              <option value="under-18">&lt; 18</option>
              <option value="19-25">19 - 25</option>
              <option value="above-25">&gt; 25</option>
            </select>

            <button type="submit" class="submitButton">Sign Up</button>
            <p>already have account?<a id="haveAccount" href="login.html">   Login</a></p>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
