<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="styling/login.css" rel="stylesheet" />
    <title>CineRating</title>
  </head>
  <body>
    <main>
      <div id="box-login">
        <h2>Login</h2>
        <div>
          <form class="formLogin" action="index.html">
            <label for="username">username/email</label>
            <input type="text" id="username" name="username" required />

            <label for="password">password</label>
            <input type="password" id="password" name="password" required />

            <button type="submit" class="submitButton">Login</button>
            <button type="submit" class="backtohome"><a href="index.html">Back to Home</a></button>
            <p>Dont have account?<a id="createAccount" href="registration.html">create account</a></p>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
